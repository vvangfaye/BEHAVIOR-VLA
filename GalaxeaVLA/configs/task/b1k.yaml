# @package _global_
defaults:
- override /model: g05
- override /tokenizer: actioncodec
- override /data: b1k
- _self_
# Pre-computed by scripts/cal_g05_b1k_stats.sh with stats_downsample_rate=100.
# At runtime the trainer will skip its in-process online stats sweep over 210 M
# frames, which otherwise blows past the pod memcg before the first step.
datastatics_path: /mnt/workspace/wangfaye/cache/g05_finetune/b1k_stats.json
model:
  pretrained_ckpt: /mnt/workspace/wangfaye/cache/huggingface/hub/OpenGalaxea/G05/g05-base/checkpoints/model_state_dict.pt
  use_torch_compile: false
  use_8bit_optimizer: false
  batch_size: 8
  max_epochs: null
  max_steps: 100000
  learning_rate: 1.0e-05
  backbone_lr_multiplier: 1.0
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  warmup_steps: 1000
  num_workers: 8
  find_unused_parameters: true
  model_arch:
    hf_processor_path: /mnt/workspace/wangfaye/cache/huggingface/hub/OpenGalaxea/G05/qwen3_5_2b_base_processor
    position_ids_type: pi0fast
    checkpoint_joint: false
    checkpoint_vision: false
    checkpoint_action_decoder: false
    # b1k is a true b1k embodiment: lower_body is real (not padded),
    # so we use the full 27D g05-base action_dim. arm groups + lower_body
    # sum to 7+7+1+1+7=23 (no padding); left_ee_pose/right_ee_pose groups
    # remain no-op and are masked out via GroupedPaddingMerger.
    action_dim: 27
    proprio_dim: 27
    discrete_action: true
    continuous_action: false
    fm:
      joint_training: true
      fm_weight: 0.0
      num_flow_samples: 8
    ar:
      ce_weight: 1.0
  processor:
    num_output_cameras: 2
    num_input_cameras: 2
    camera_size_config:
      exterior:
      - 256
      - 256
      wrist_left:
      - 256
      - 256
      wrist_right:
      - 256
      - 256
    norm_default_mode: q01/q99
    vlm_input_action_norm_default_mode: null
    vlm_input_action_norm_exception_mode: null
    tokenizer_params:
      local_files_only: true
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,merge_spec}
      merge: true
tokenizer:
  vq_config:
    ckpt_dir: /mnt/workspace/wangfaye/cache/huggingface/hub/OpenGalaxea/G05/action_tokenizer.pt
    block_wise_autoregressive: false
    model_arch:
      codebook_size: 4096
    num_residuals: 2
    rule_based_key_patterns:
    - gripper
    rule_based_binarize_threshold: 0.0
    use_group_markers: true
    group_order_shuffle: false
    absent_key_fill_value: -100.0
    dropout_noop_parts: true
    # Keep the complete five-group vocabulary used by g05-base so group
    # marker IDs are stable across embodiments.
    parts_meta:
      left_control: 9
      left_gripper: 1
      right_control: 9
      right_gripper: 1
      lower_body: 7