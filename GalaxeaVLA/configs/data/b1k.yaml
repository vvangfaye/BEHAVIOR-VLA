# Self-contained BEHAVIOR-1K (2026 challenge demos) data config.
#
# Layout (LeRobot v3.0 flat parquet):
#   action           : 23D  [base(3), torso(4), left_arm(7), left_gripper(1),
#                              right_arm(7), right_gripper(1)]
#   observation.state: 61D  [base_qvel(3), left_arm(7), left_gripper(2),
#                              right_arm(7), right_gripper(2), torso(4)]
#   images (separate mp4 videos under videos/<video_key>/chunk-XXX/file-XXX.mp4):
#     observation.rgb.zed_link_camera_0                  -> head_rgb (720x720)
#     observation.rgb.left_realsense_link_camera_0       -> left_wrist_rgb (480x480)
#     observation.rgb.right_realsense_link_camera_0      -> right_wrist_rgb (480x480)
#
# Mapping into G0.5 27D grouped layout (see parts_meta/b1k_27dim.yaml):
#   left_arm(7) + left_gripper(1) + right_arm(7) + right_gripper(1)
#   + lower_body(7) [= trunk_qpos(4) + base_qvel(3)]
#   = 23D (matches raw action exactly; remaining groups in 27D padding are no-op).
#
# Existing BehaviorPerKeyTransform in
# src/g05/data_processor/transforms/relative_action.py already handles
# gripper 2D->1D collapse, left/right arm relative, lower-body merge and
# partial-relative trunk. We feed it state as separate trunk_qpos + base_qvel
# via start_index slices into observation.state, since the parquet does not
# store them as named columns.
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
obs_stride_second: 0.0
val_set_proportion: 1e-4
is_training_set: true
processors:
  behavior_1k:
    shape_meta: &b1k_shape_meta
      action:
      # 23D action sliced from raw flat 'action' column
      # [base(3) | torso(4) | left_arm(7) | left_gripper(1) | right_arm(7) | right_gripper(1)]
      - key: base_qvel
        lerobot_key: action
        start_index: 0
        raw_shape: 3
        shape: 3
        time_offset: 0
      - key: trunk_qpos
        lerobot_key: action
        start_index: 3
        raw_shape: 4
        shape: 4
        time_offset: 0
      - key: left_arm
        lerobot_key: action
        start_index: 7
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: action
        start_index: 14
        raw_shape: 1
        shape: 1
        time_offset: 0
      - key: right_arm
        lerobot_key: action
        start_index: 15
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: action
        start_index: 22
        raw_shape: 1
        shape: 1
        time_offset: 0
      state:
      # 61D state sliced from raw flat 'observation.state' column
      # [base_qvel(3) | left_arm(7) | left_gripper(2) | right_arm(7) | right_gripper(2) | torso(4)]
      - key: base_qvel
        lerobot_key: observation.state
        start_index: 0
        raw_shape: 3
        shape: 3
        time_offset: 0
      - key: left_arm
        lerobot_key: observation.state
        start_index: 3
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: left_gripper
        lerobot_key: observation.state
        start_index: 24
        raw_shape: 2
        shape: 1  # BehaviorPerKeyTransform collapses 2D width -> 1D relative width.
        time_offset: 0
      - key: right_arm
        lerobot_key: observation.state
        start_index: 28
        raw_shape: 7
        shape: 7
        time_offset: 0
      - key: right_gripper
        lerobot_key: observation.state
        start_index: 49
        raw_shape: 2
        shape: 1  # BehaviorPerKeyTransform collapses 2D width -> 1D relative width.
        time_offset: 0
      - key: trunk_qpos
        lerobot_key: observation.state
        start_index: 53
        raw_shape: 4
        shape: 4
        time_offset: 0
      images:
      - key: head_rgb
        camera_type: exterior
        lerobot_key: observation.rgb.zed_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 720
        - 720
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
      - key: left_wrist_rgb
        camera_type: wrist_left
        lerobot_key: observation.rgb.left_realsense_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 480
        - 480
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
      - key: right_wrist_rgb
        camera_type: wrist_right
        lerobot_key: observation.rgb.right_realsense_link_camera_0
        start_index: 0
        raw_shape:
        - 3
        - 480
        - 480
        shape:
        - 3
        - 224
        - 224
        time_offset: 0
    action_state_transforms:
    # BehaviorPerKeyTransform expects state keys {trunk_qpos, base_qvel} plus
    # left/right arm and 2D grippers; merges trunk_qpos+base_qvel into lower_body
    # and applies partial trunk-relative on the action lower_body.
    - _target_: g05.data_processor.transforms.relative_action.BehaviorPerKeyTransform
      gripper_max_width: 0.1
      trunk_relative_dims: [0, 1, 2]
    train_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
    norm_default_mode: z-score-tail
    norm_exception_mode:
      action:
        left_gripper: q01/q99
        right_gripper: q01/q99
      state:
        left_gripper: q01/q99
        right_gripper: q01/q99
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.BaseActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/b1k_27dim.yaml,merge_spec}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false
embodiment_datasets:
  behavior_1k:
    type: g05.data.base_lerobot_datasetV3.BaseLerobotDatasetV3
    embodiment_type: behavior_1k
    lerobot_ds_version: '3.0'
    shape_meta: *b1k_shape_meta
    dataset_groups:
    - weight: 1.0
      dataset_dirs:
      - /var/tmp/behavior-1k/2026-challenge-demos