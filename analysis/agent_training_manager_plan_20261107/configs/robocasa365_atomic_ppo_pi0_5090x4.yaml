# RoboCasa365 atomic-task RLinf-PPO for pi0 (RLinf pretrain-human300), 5090x4 layout (2026-11-04). Generated from
# RLinf examples/embodiment/config/robocasa365_opendrawer_ppo_openpi.yaml (PPO hyperparameters unchanged): local model
# and pinned norm stats, env+rollout on GPUs 0-1 / actor on 2-3, 32 envs x 4 epochs = 128 episodes per iteration,
# task horizons, 256x256 cameras (as in RLinf's official robocasa365 eval). Set env.train.task_filter per run.
defaults:
- env/robocasa365@env.train
- env/robocasa365@env.eval
- model/pi0@actor.model
- weight_syncer/patch_syncer@weight_syncer
- hybrid_engines/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-1
    actor: 2-3
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: robocasa365_atomic_ppo_pi0
    logger_backends:
    - tensorboard
  max_epochs: 20
  max_steps: -1
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 4
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 4
    total_num_envs: 32
    split: pretrain
    task_soup: atomic_seen
    task_filter:
    - OpenDrawer
    task_mode: atomic
    task_sampling_strategy: random
    max_episode_steps: 750
    max_steps_per_rollout_epoch: 750
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    episode_horizon_source: task_horizon
    init_params:
      camera_heights: 256
      camera_widths: 256
  eval:
    rollout_epoch: 1
    total_num_envs: 32
    split: pretrain
    task_soup: atomic_seen
    task_filter:
    - OpenDrawer
    task_mode: atomic
    task_sampling_strategy: ordered
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 750
    max_steps_per_rollout_epoch: 750
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    init_params:
      camera_heights: 256
      camera_widths: 256
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: robocasa
  enable_offload: false
  pipeline_stage_num: 1
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
    max_new_tokens: null
  model:
    model_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-pi0-robocasa-pretrain-human300
    precision: null
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 2048
  seed: 42
  enable_offload: false
  model:
    model_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-pi0-robocasa-pretrain-human300
    num_action_chunks: 5
    action_dim: 12
    num_steps: 5
    add_value_head: true
    openpi:
      task: rl
      config_name: pi0_robocasa365_pretrain_human300
      num_images_in_input: 2
      num_steps: 5
      detach_critic_input: true
    openpi_data:
      state_space: 16d
      image_space: 2views
      action_space: 12d
      norm_stats_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-pi0-robocasa-pretrain-human300/physical-intelligence/robocasa/norm_stats.json
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
reward:
  use_reward_model: false
critic:
  use_critic_model: false
