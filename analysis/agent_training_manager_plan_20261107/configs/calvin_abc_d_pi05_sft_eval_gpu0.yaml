# CALVIN ABC->D baseline evaluation of RLinf-Pi05-CALVIN-ABC-D-SFT on GPU 0 only (feasibility check 2026-11-03).
# Env/eval and model settings copied from examples/embodiment/config/calvin_abc_d_ppo_openpi_pi05.yaml
# (eval section + rollout model); only placement, model path and video are changed.
defaults:
  - env/calvin_d@env.eval
  - model/pi0_5@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "calvin_abc_d_pi05_sft_eval"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: True
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 1
    total_num_envs: 50
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 9600
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    is_eval: True
    group_size: 1
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_path: "/mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-Pi05-CALVIN-ABC-D-SFT"
    model_type: "openpi"
    num_action_chunks: 5
    openpi:
      task: eval
      config_name: "pi05_calvin"
      num_images_in_input: 2
      noise_level: 0.5
