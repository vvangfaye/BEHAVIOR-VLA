# LIBERO-10 pi0.5 NFT baseline (RLinf embodied_nft, likelihood-free on the native ODE sampler), 5090x4 layout
# (2026-11-04). Generated from libero_10_ppo_pi05_5090x4.yaml: same model, envs, 128 episodes/iteration
# (32 envs x 4 epochs = 16 init states x group 8), chunk 10. NFT hyperparameters = RLinf's
# examples/embodiment/config/libero_object_0_nft_openpi.yaml (GRPO, update_epoch 2, global batch 512, lr 5e-6).
defaults:
- env/libero_10@env.train
- env/libero_10@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0-1
    actor: 2-3
runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_nft_openpi_pi05
    logger_backends:
    - tensorboard
  max_epochs: 10
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo
  loss_type: embodied_nft
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: true
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  nft_loss_form: mse
  nft_beta: 1.0
  adv_clip_max: 0.5
  dpo_beta: 1.0
  nft_weight_mode: auto
  nft_weight_scale:
  - 1.0
  - 0.2
  nft_target_space: x0
  nft_xcur_source: resample
  nft_tau:
  - 1.0
  - 0.01
  - 20
  - 100
  recompute_v: false
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 4
    total_num_envs: 32
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    reward_coef: ${algorithm.reward_coef}
    skip_intermediate_renders: true
    group_size: ${algorithm.group_size}
  eval:
    rollout_epoch: 1
    total_num_envs: 64
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-Pi05-LIBERO-SFT
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 512
  seed: 42
  enable_offload: false
  model:
    model_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/libero_feasibility_20261103/models/RLinf-Pi05-LIBERO-SFT
    model_type: openpi
    add_value_head: false
    openpi:
      task: rl
      value_after_vlm: true
      is_nft: true
      noise_level: 0.0
      noise_method: flow_ode
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 1000
    min_lr_rate: 0.1
    lr_scheduler: cosine
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
