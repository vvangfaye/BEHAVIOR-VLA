actor:
  model:
    model_type: openpi
    precision: null
    pi05: true
    is_lora: false
    lora_rank: 32
    num_action_chunks: 16
    action_dim: 23
    use_proprio: true
    num_steps: 10
    add_value_head: true
    openpi:
      task: rl
      config_name: pi05_behavior
      num_images_in_input: 3
      noise_level: 0.4
      action_chunk: 16
      num_steps: 10
      train_expert_only: true
      action_env_dim: 23
      noise_method: flow_sde
      add_value_head: true
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 512
      torch_compile: false
      joint_logprob: false
      ignore_last: true
      action_horizon: 32
    model_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/rlinf_adaptation_20261020/checkpoint1688977_openpi
    num_images_in_input: 3
    proprio_dim: 25
    b1k_joint:
      enabled: true
      state_layout: canonical25
      norm_stats_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/rlinf_adaptation_20261020/checkpoint1688977_openpi/norm_stats.json
      tokenizer_path: /mnt/data1/faye/code/Behavior-1k Challenge/analysis/organizer_rehearsal_1688977_20261016/runtime/policy-bundle/rootfs/mnt/afs/260010165/behavior_1k/runtime_20261007_1306/openpi-cache/big_vision/paligemma_tokenizer.model
      subtask_interval: 1
      subtask_temperature: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: true
  optim:
    lr: 1.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync:
      enabled: true
      prefixes: null
      bucket_size: 134217728
cluster:
  num_nodes: 1
  component_placement:
    rollout: 1
    env: 0
    actor: all
runner:
