[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "b1k-rlinf-adapter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "sentencepiece", "torch>=2.5", "omegaconf", "tensorstore", "safetensors"]

[tool.setuptools.packages.find]
include = ["b1k_rlinf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
