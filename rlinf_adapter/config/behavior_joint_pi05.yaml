# Based on RLinf 91a302ec; preserves the 1688977 joint-policy interface.
defaults:
- env/behavior_r1pro@env.train
- env/behavior_r1pro@env.eval
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:RLINF_ROOT}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    rollout: 1
    env: 0
    actor: all
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:B1K_RL_OUTPUT}
    project_name: rlinf
    experiment_name: b1k_joint_pi05_ppo
    logger_backends:
    - tensorboard
  only_eval: false
  max_epochs: 20
  max_steps: -1
  val_check_interval: 5
  save_interval: 5
  seq_length: 4096
  max_prompt_length: 50
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 10.0
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 2
    total_num_envs: 2
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    reward_coef: ${algorithm.reward_coef}
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/train
      fps: 15
    num_env_subprocess: 1
    enable_offload: true
    enable_init_offload: false
    omni_config:
      env:
        action_frequency: ${oc.env:B1K_ACTION_FREQUENCY,30}
        rendering_frequency: ${oc.env:B1K_ACTION_FREQUENCY,30}
      camera:
        head_resolution:
        - 240
        - 240
        wrist_resolution:
        - 240
        - 240
      robots:
      - type: R1Pro
        name: robot_r1
        action_normalize: false
        grasping_mode: assisted
        self_collisions: true
        proprio_obs:
        - base_qvel
        - trunk_qpos
        - arm_left_qpos
        - gripper_left_qpos
        - arm_right_qpos
        - gripper_right_qpos
      task:
        activity_name: ${oc.env:B1K_TASK,turning_on_radio}
        activity_instance_id: ${oc.env:B1K_TRAIN_INSTANCE,1}
        instance_resample_mode: disabled
        activity_instance_dir: ${oc.env:B1K_TRAIN_INSTANCES}
  eval:
    rollout_epoch: 2
    total_num_envs: 2
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15
    num_env_subprocess: 1
    omni_config:
      env:
        action_frequency: ${oc.env:B1K_ACTION_FREQUENCY,30}
        rendering_frequency: ${oc.env:B1K_ACTION_FREQUENCY,30}
      camera:
        head_resolution:
        - 240
        - 240
        wrist_resolution:
        - 240
        - 240
      robots:
      - type: R1Pro
        name: robot_r1
        action_normalize: false
        grasping_mode: assisted
        self_collisions: true
        proprio_obs:
        - base_qvel
        - trunk_qpos
        - arm_left_qpos
        - gripper_left_qpos
        - arm_right_qpos
        - gripper_right_qpos
      task:
        activity_name: ${oc.env:B1K_TASK,turning_on_radio}
        activity_instance_id: ${oc.env:B1K_EVAL_INSTANCE,301}
        instance_resample_mode: disabled
        activity_instance_dir: ${oc.env:B1K_EVAL_INSTANCES}
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  # only_eval builds directly from rollout.model; preserve the same architecture
  # and action-interface configuration used during training.
  model: ${actor.model}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: true
  model:
    model_path: ${oc.env:B1K_RL_CHECKPOINT}
    add_value_head: true
    num_images_in_input: 3
    proprio_dim: 25
    action_dim: 23
    num_action_chunks: 16
    num_steps: 10
    openpi:
      task: rl
      config_name: pi05_behavior
      num_images_in_input: 3
      value_after_vlm: true
      value_vlm_mode: mean_token
      detach_critic_input: true
      joint_logprob: false
      ignore_last: true
      noise_level: 0.4
      noise_method: flow_sde
      train_expert_only: true
      action_horizon: 32
      action_chunk: 16
      model_action_dim: 32
      max_token_len: 512
      torch_compile: false
    b1k_joint:
      enabled: true
      state_layout: canonical25
      norm_stats_path: ${oc.env:B1K_RL_CHECKPOINT}/norm_stats.json
      tokenizer_path: ${oc.env:B1K_TOKENIZER}
      subtask_interval: 1
      subtask_temperature: 0.0
      # Shared train/eval opt-in. The 0.001 candidate did not resolve the
      # instance-301 PPO regression; preserve legacy behavior by default.
      execution_gripper_open_tolerance: 0.0
  optim:
    lr: 1.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
